<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تم اختراق هذا الموقع</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050505;
    --fg: #19ff6a;
    --dim: #0c7a35;
    --alert: #ff2d2d;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: "Cairo", Tahoma, "Segoe UI", sans-serif;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    text-align: center;
  }
  canvas#rain { position: fixed; inset: 0; width: 100%; height: 100%; opacity: .28; }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.35) 0 1px, transparent 1px 3px);
  }
  main { position: relative; z-index: 2; padding: 24px; max-width: 900px; width: 100%; }
  .skull { font-size: clamp(64px, 14vw, 120px); line-height: 1; filter: drop-shadow(0 0 18px var(--fg)); }
  h1 {
    margin: 12px 0 8px;
    font-weight: 900;
    font-size: clamp(30px, 7vw, 64px);
    line-height: 1.35;
    color: var(--fg);
    text-shadow: 0 0 12px rgba(25,255,106,.7), 0 0 40px rgba(25,255,106,.35);
    position: relative;
  }
  h1 .group { color: var(--alert); text-shadow: 0 0 14px rgba(255,45,45,.7); display: block; }
  .glitch { animation: glitch 3.2s infinite steps(1); }
  @keyframes glitch {
    0%, 92%, 100% { transform: none; text-shadow: 0 0 12px rgba(25,255,106,.7); }
    93% { transform: translate(-4px, 1px); text-shadow: 3px 0 #ff2d2d, -3px 0 #2d7bff; }
    95% { transform: translate(4px, -1px); text-shadow: -3px 0 #ff2d2d, 3px 0 #2d7bff; }
    97% { transform: translate(-2px, 0); }
  }
  p.msg { color: var(--dim); font-weight: 600; font-size: clamp(15px, 3.2vw, 20px); margin: 6px 0 22px; }
  .term {
    direction: ltr; text-align: left;
    margin: 0 auto; max-width: 560px;
    border: 1px solid var(--dim);
    background: rgba(0,0,0,.65);
    padding: 14px 16px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 14px; line-height: 1.7;
    min-height: 150px;
    white-space: pre-wrap;
  }
  .cursor { display: inline-block; width: 9px; height: 1em; background: var(--fg); vertical-align: -2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  footer { margin-top: 20px; font-size: 13px; color: var(--dim); }
  @media (prefers-reduced-motion: reduce) {
    .glitch, .cursor { animation: none; }
  }
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<main>
  <div class="skull" aria-hidden="true">💀</div>
  <h1 class="glitch">
    تم اختراق هذا الموقع من قبل
    <span class="group">المجموعة الزنجية</span>
  </h1>
  <p class="msg">أمن موقعكم ضعيف... وقد تم تنبيهكم.</p>
  <div class="term" id="term" aria-live="off"></div>
  <footer>This site has been hacked.</footer>
</main>

<script>
(function () {
  // Terminal typing effect
  var lines = [
    "$ nmap -sV target.site",
    "[+] port 80 open",
    "[+] gaining access...",
    "[+] access granted",
    "[+] defacing index.html ... done",
    "$ _"
  ];
  var term = document.getElementById("term");
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) { term.textContent = lines.join("\n"); }
  else {
    var li = 0, ci = 0, out = "";
    (function tick() {
      if (li >= lines.length) return;
      var line = lines[li];
      ci++;
      term.textContent = out + line.slice(0, ci);
      if (ci >= line.length) { out += line + "\n"; li++; ci = 0; setTimeout(tick, 380); }
      else setTimeout(tick, 35);
    })();
  }

  // Code rain
  var c = document.getElementById("rain"), ctx = c.getContext("2d");
  var chars = "01ابتثجحخدذرزسشصضطظعغفقكلمنهوي".split("");
  var size = 16, cols, drops;
  function resize() {
    c.width = window.innerWidth; c.height = window.innerHeight;
    cols = Math.floor(c.width / size);
    drops = Array(cols).fill(0).map(function () { return Math.random() * -50; });
  }
  resize(); window.addEventListener("resize", resize);
  function draw() {
    ctx.fillStyle = "rgba(5,5,5,.08)"; ctx.fillRect(0, 0, c.width, c.height);
    ctx.fillStyle = "#19ff6a"; ctx.font = size + "px monospace";
    for (var i = 0; i < cols; i++) {
      var ch = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillText(ch, i * size, drops[i] * size);
      if (drops[i] * size > c.height && Math.random() > .975) drops[i] = 0;
      drops[i]++;
    }
  }
  if (!reduce) setInterval(draw, 55);
})();
</script>
</body>
</html>
